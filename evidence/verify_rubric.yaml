rubrics:
  - id: 1
    type: f2p
    text: "命令行和 Config/Run 均能选择记录或回放文件，配置键和命令行覆盖按既有规则生效；合并后两个模式同时非空会在输入收集、数据源读取和渲染输出创建前明确拒绝。"
  - id: 2
    type: f2p
    text: "记录只收录实际成功读取的原始字节与有效 MIME，保留空载荷、目录列表和 merge 结果；请求身份区分别名、首参数、既有 URL/类型提示和生效 Header，额外参数仍被忽略，重复成功读取缓存且未用源不被预取。"
  - id: 3
    type: f2p
    text: "同次 Run 的输出命名、上下文、正文和嵌套模板中的数据源读取均进入同一快照，动态 defineDatasource 与直接 URL 读取同样可记录；这些读取不能因发生在不同阶段而遗漏或混淆。"
  - id: 4
    type: f2p
    text: "其他输入与配置不变时，冷进程回放为上下文和 ds 提供相同解析值、为 include 提供相同原始文本，输出路径与正文一致；对应数据源的实时文件、目录和 HTTP 访问为零，且快照文件内容不变。"
  - id: 5
    type: f2p
    text: "回放遇到未记录请求或 URL、类型提示、Header 等身份不匹配时，ds/include 与上下文读取明确失败而 datasourceReachable 返回 false，均不访问实时源；损坏或不支持版本的快照在输入收集及数据源读取前被拒绝，录制中的失败探测不保存为成功载荷。"
  - id: 6
    type: f2p
    text: "只有模板收集和渲染全部成功才发布快照；晚期模板解析或执行失败、输出写入失败及快照保存失败均返回错误、保留已有快照并清理未发布临时文件，修正后重录能完整替换旧快照并支持冷回放。"
  - id: 7
    type: p2p
    text: "未开启新模式时，原单模板与目录渲染、上下文加载、数据源按需缓存、原始 include、MIME 覆盖和读取失败语义保持兼容；输入及嵌套模板文件、直接环境/文件函数、插件仍按原入口工作。"
